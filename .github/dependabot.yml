# Keeps the SHA-pinned actions in .github/workflows current. Dependabot moves
# the SHA and rewrites the trailing "# vX.Y.Z" comment, which is why the pins
# carry the exact release rather than the major tag.
#
# Python dependencies are not listed: requirements.lock.txt and
# requirements-docs.lock.txt are uv --universal compiles, which Dependabot's pip
# updater would rewrite without the per-interpreter markers. pip-audit in
# ci.yml watches them instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed, so a compromised
    # or yanked tag has time to be noticed upstream.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
