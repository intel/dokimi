# Builds and tests dokimi's conda packages and wheels, see ci/README.md
name: Intel CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  # The latest conda-forge and PyPI releases, which PRs and main pushes get from the locks instead.
  # A failure opens an issue (the report job) rather than failing anyone's PR.
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

# As in ci.yml: a push or tag run gets a group of its own, so a queued main push is never dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Platforms and Python versions
    runs-on: ${{ vars.GH_CI_RUNNER || (github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest') }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.declared.outputs.matrix }}
      wheel: ${{ steps.declared.outputs.wheel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Read the declared platforms and Python versions
        id: declared
        run: |
          python ci/matrix.py --event "$GITHUB_EVENT_NAME" --github-output matrix
          python ci/matrix.py --system wheel --event "$GITHUB_EVENT_NAME" --github-output wheel

  build:
    name: ${{ matrix.name }} Python ${{ matrix.python }}
    needs: matrix
    runs-on: ${{ vars.GH_CI_RUNNER || (github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Renovate bumps miniforge-version and the conda-build pin below (.github/renovate.json5).
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          miniforge-version: 26.7.2-0
          activate-environment: ""
          conda-remove-defaults: "true"

      - name: Install conda-build
        run: conda install -y -q -n base --override-channels -c conda-forge "conda-build ==26.9.1"

      # A PR or a main push runs the recipe tests in the test job's locked environment instead.
      - name: Build, with the recipe tests on a tag or the schedule
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          LATEST: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' }}
        run: |
          if [ "$LATEST" = true ]; then
            python ci/build.py --python "$PYTHON_VERSION" --output "$RUNNER_TEMP/output"
          else
            python ci/build.py --python "$PYTHON_VERSION" --output "$RUNNER_TEMP/output" --no-test
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dokimi ${{ matrix.name }} Python ${{ matrix.python }}
          path: ${{ runner.temp }}/output/*.conda
          if-no-files-found: error
          # Tags keep them 30 days.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 3 }}

  test:
    name: Test ${{ matrix.name }} Python ${{ matrix.python }}
    needs: [matrix, build]
    runs-on: ${{ vars.GH_CI_RUNNER || (github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dokimi ${{ matrix.name }} Python ${{ matrix.python }}
          path: ${{ runner.temp }}/artifacts

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          miniforge-version: 26.7.2-0
          activate-environment: ""
          conda-remove-defaults: "true"

      - name: Install the package and run ci/test.py
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          EVENT: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || github.event_name == 'schedule' && 'schedule' || github.event_name == 'pull_request' && 'pr' || 'push' }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python ci/hooks.py --python "$PYTHON_VERSION" --artifacts "$RUNNER_TEMP/artifacts"
          --work "$RUNNER_TEMP/hooks" --event "$EVENT" --commit "$COMMIT"

  build-wheel:
    name: ${{ matrix.name }} Wheels Python ${{ matrix.python }}
    needs: matrix
    runs-on: ${{ vars.GH_CI_RUNNER || (github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.wheel) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The wheel is pure Python: pip builds it with this job's Python version.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: python ci/build.py --system wheel --python "$PYTHON_VERSION" --output "$RUNNER_TEMP/output"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dokimi ${{ matrix.name }} Wheels Python ${{ matrix.python }}
          path: ${{ runner.temp }}/output/*.whl
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 3 }}

  test-wheel:
    name: Test ${{ matrix.name }} Wheels Python ${{ matrix.python }}
    needs: [matrix, build-wheel]
    runs-on: ${{ vars.GH_CI_RUNNER || (github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.wheel) }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dokimi ${{ matrix.name }} Wheels Python ${{ matrix.python }}
          path: ${{ runner.temp }}/artifacts

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          miniforge-version: 26.7.2-0
          activate-environment: ""
          conda-remove-defaults: "true"

      - name: Install the wheel and run ci/test.py
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          EVENT: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || github.event_name == 'schedule' && 'schedule' || github.event_name == 'pull_request' && 'pr' || 'push' }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python ci/hooks.py --kind wheel --python "$PYTHON_VERSION" --artifacts "$RUNNER_TEMP/artifacts"
          --work "$RUNNER_TEMP/hooks" --event "$EVENT" --commit "$COMMIT"

  # A scheduled run that fails opens one issue (or comments on the open one), as pip-audit.yml's report does.
  report:
    name: Report a failed scheduled run
    needs: [build, test, build-wheel, test-wheel]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ${{ vars.GH_CI_RUNNER || (github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest') }}
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Intel CI: the latest conda-forge or PyPI releases fail the weekly run"
          body="The scheduled Intel CI run failed: $RUN_URL. It resolves the latest releases; PRs and main pushes install ci/conda-lock/ and dokimi/requirements.lock.txt, so they are not affected. Merge a lock refresh (conda-lock.yml) only once this is understood."
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body" --label dependencies
          fi
