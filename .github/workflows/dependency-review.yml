name: dependency-review

# Judges only the dependencies a PR changes (pip-audit.yml audits the locks daily).
# Path-filtered, so it must stay out of the required checks.
on:
  pull_request:
    paths:
      - 'dokimi/requirements*.txt'
      - 'dokimi/pyproject.toml'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    # A short job: ubuntu-latest, as for the other short jobs (see ci.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          # The filelock advisories SECURITY.md documents; tests/test_advisory_lists.py
          # keeps them in sync with pip-audit.yml and dokimi/osv-scanner.toml.
          allow-ghsas: GHSA-567q-5qvw-pf92,GHSA-6627-m3xw-93mp,GHSA-69hj-f68j-2879,GHSA-8mx5-7m5m-r77g,GHSA-9c4x-gm8v-wgc4,GHSA-9j6q-wvj5-jgjg,GHSA-9vhv-jxww-xfm5,GHSA-cwqr-hh33-gh44,GHSA-fq56-3cx3-fjxp,GHSA-j8f7-rjxc-mr56,GHSA-m462-7rxw-wvpg,GHSA-rfpc-qcw5-3pc4,GHSA-v4x8-3wr5-3wq8
          # The summary only: a PR comment would need pull-requests: write,
          # which a fork PR's token does not have.
          comment-summary-in-pr: never
