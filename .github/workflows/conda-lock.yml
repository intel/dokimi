# Re-solves ci/conda-lock/ (ci/lock.py) once a week and opens, or updates, one PR with the result.
# A conda-forge build that breaks the tests then fails that PR, not everyone else's; see ci/README.md.
name: Conda lock refresh

on:
  schedule:
    - cron: '53 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the Intel CI conda locks
    # A fork has no use for the PR.
    if: github.repository == 'intel/dokimi'
    runs-on: ${{ vars.GH_CI_RUNNER || 'intel-ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      # main, whatever ref a manual run was dispatched on: the refresh branch is cut from it and its PR is based on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # Renovate bumps both pins (.github/renovate.json5).
      - name: Install py-rattler
        run: python -m pip install --no-input "py-rattler ==0.28.1" "pyyaml ==6.0.3"

      - name: Solve the locks
        run: python ci/lock.py

      # A PR opened with GITHUB_TOKEN starts no workflows, so CONDA_LOCK_TOKEN (an app or fine-grained token) is required.
      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ secrets.CONDA_LOCK_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CONDA_LOCK_TOKEN is not set: a refresh PR opened with GITHUB_TOKEN would get no Intel CI run."
            exit 1
          fi
          branch=ci/conda-lock-refresh
          # --head also matches fork PRs: only the bot's own branch counts.
          open_pr() { gh pr list --head "$branch" --state open --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty'; }
          if [ -z "$(git status --porcelain -- ci/conda-lock)" ]; then
            echo "The locks are current."
            # A refresh PR still open proposes locks main has since passed: retire it.
            stale="$(open_pr)"
            if [ -n "$stale" ]; then
              gh pr close "$stale" --delete-branch \
                --comment "Closed by $RUN_URL: main's locks already match a fresh solve, so this refresh is obsolete."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add ci/conda-lock
          git commit -q -s -m "ci(conda-lock): refresh the Intel CI conda locks"
          gh auth setup-git
          git push --force origin "$branch"
          if [ -z "$(open_pr)" ]; then
            gh pr create --base main --head "$branch" --label dependencies \
              --title "ci(conda-lock): refresh the Intel CI conda locks" \
              --body "Re-solved by $RUN_URL from the specs in each lock's header, with builds at least 7 days old. Intel CI on this PR tests the new locks."
          fi
