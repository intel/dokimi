name: ci

on:
  push:
    branches: [ main ]
  # labeled/unlabeled: skip-changelog and schema-break-ok are read from the labels of the
  # event that started the run, so a label change re-runs the matrix to pick it up.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    # Weekly: the unpinned-dependency canary (test-latest) runs only here.
    - cron: '17 5 * * 1'

permissions:
  contents: read

# Runners: a job that takes more than 3 minutes runs on intel-ubuntu-latest,
# Intel's ephemeral runner pool; a shorter one runs on ubuntu-latest. ubuntu-latest
# is shared by every intel/ repository: a job there waited 28 min or more for a
# runner one time in ten (October 2026). The pool boots a fresh runner per job, a
# wait of about 4 min (median), p90 8 min, so a seconds-long check costs more on
# the pool than it takes to run. That is why the small checks share `static`
# instead of each booting a runner, and why only the test matrix (`test` and
# `test-latest`, about 4-5 min each) is on the pool. Fork PRs against intel/dokimi
# run on the pool as well (repository_owner is the base repository's); an outside
# contributor's runs need a maintainer's approval first. A fork's own pushes fall
# back to ubuntu-latest. release.yml and stack-health.yml, not PR checks, stay on
# ubuntu-latest. windows-smoke, a PR check, runs on windows-latest.

# A new push to a PR supersedes the run in flight. Every other run gets a group of its
# own (run_id): in a shared group a third queued run cancels the pending second one
# even with cancel-in-progress false, so pushes to main would be dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: dokimi

# Single-version jobs (here, in agent-quality.yml, docs.yml and
# stack-health.yml) and `make dev` use Python 3.13, not 3.14: scikit-network
# (pulled in by ragas) has no cp314 wheels yet, so on 3.14 every install builds
# it from source (C++ with OpenMP, unpinned build deps); the pip cache keeps the
# built wheel for the 3.14 test leg. Move them to 3.14 once scikit-network ships
# cp314 wheels.
jobs:
  # The checks that need no dependency lock, in one job: each takes seconds, and
  # as separate jobs each waited for a runner of its own. Every step after the
  # install runs even when an earlier one fails (!cancelled()), so one finding
  # does not hide the next. The PR-only checks at the end (the commit secret scan,
  # the changelog fragment, the docs review list, schema compatibility) share the
  # runner for the same reason.
  static:
    name: Static checks (ruff, schema, zizmor, licenses, pre-commit, bandit, secrets, changelog, schema compat)
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit scan, the changelog and schema checks diff
      # against the base branch's tip (fetched by this checkout).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      # The tools, hash-locked in dokimi/requirements-ci.lock.txt (input:
      # requirements-ci.txt, which says why ruff is an exact pin). Every install
      # from a lock passes --require-hashes, so a tampered or re-uploaded
      # artifact fails the install.
      - name: Install tools
        run: pip install --require-hashes -r requirements-ci.lock.txt
      # Lint only: most of the tree predates the formatter (205 of 276 files would
      # be rewritten), so a format gate would mean a repo-wide reformat first.
      - name: ruff check
        if: ${{ !cancelled() }}
        run: ruff check .
      - name: schema-check
        if: ${{ !cancelled() }}
        run: python -m dokimi.schema_check benchmarks/spec.v1.yaml
      - name: registry-drift-check
        if: ${{ !cancelled() }}
        run: python -m dokimi.config_check
      # Not a gate: file length and complexity totals and the top offenders in
      # the step summary, so the trend is visible per run. The gate (no growth
      # past scripts/growth_baseline.json) is tests/test_growth_ratchet.py.
      - name: File length and complexity report
        if: ${{ !cancelled() }}
        run: python scripts/check_growth.py --report --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: guidance self-scan (L0)
        if: ${{ !cancelled() }}
        run: python cli.py repo scan .. --manifest-file benchmarks/self-scan.repo-eval.yaml --fail-on-fail
      # Static audit of the workflow files: unpinned actions, template injection,
      # credential persistence, over-broad token permissions.
      - name: zizmor
        if: ${{ !cancelled() }}
        working-directory: .
        run: zizmor --offline --min-severity medium .github/workflows
      # Every tracked file carries the SPDX license header; scope and exceptions
      # are in .github/.licenserc.yaml. A `uses:` step, so `make ci-local` skips
      # it (the config's header comment has the docker command for a local run).
      # The released image, not the apache/skywalking-eyes/header action, which
      # installs Go and builds license-eye on every run. Log level error: the
      # pattern-only config makes info level warn once per file type about a
      # missing license template; invalid files are still listed at error.
      - name: License header check
        if: ${{ !cancelled() }}
        uses: docker://apache/skywalking-eyes:0.9.0@sha256:cd89ccbbcba2e87d3fb0e34b156b1da208d6c5ac1ada4e2d335e920022c765b8
        with:
          args: -v error -c .github/.licenserc.yaml header check
      # The hooks in .pre-commit-config.yaml, so they stay green on main: a change
      # that fails one fails here, not on the next contributor's commit. ruff-check
      # and zizmor are skipped: the steps above run the same versions. gitleaks
      # checks staged changes only, so it has nothing to do here; the Scan commits
      # step below scans the PR's commits.
      - name: pre-commit
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          SKIP: ruff-check,zizmor,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color always
      # bandit holds the baseline SECURITY.md describes: no Medium/High finding.
      # The dependency audit is pip-audit.yml: it runs when a lock changes and
      # daily, so a new advisory does not fail PRs that leave the locks alone.
      - name: bandit
        if: ${{ !cancelled() }}
        run: bandit -r . -ll -q
      # Secret scan of git history with the gitleaks CLI: on a PR, the commits it
      # adds over the base branch (a secret committed and then deleted is still in
      # them); on a push to main, the whole history (seconds: about 280 commits).
      # The CLI, not gitleaks/gitleaks-action: the action needs a license key for
      # repositories owned by an organization, and is under its own license.
      # The findings are redacted in the log, which is public. A false positive (a
      # test fixture, a placeholder key): append `gitleaks:allow` in a comment on the
      # line, or allowlist it in a `.gitleaks.toml` at the repo root (gitleaks reads
      # it on its own; start it with `[extend] useDefault = true`), path plus rule or
      # regex, with the reason. A finding in a merge commit (a conflict resolution)
      # is reported under `b/<path>`, so a path entry must match that (`^(b/)?f\.txt$`).
      # A finding in a commit already on main goes in `.gitleaksignore` by its
      # fingerprint (printed with each finding); copy the fingerprint as printed.
      # A real secret: revoke it first; deleting it from the tree does not remove it
      # from history or from the copies forks and clones already have.
      # The release tarball, checked against a SHA-256 kept here rather than the
      # release's own checksums file, which comes from the same place as the
      # tarball. The version is the gitleaks rev in .pre-commit-config.yaml;
      # Renovate bumps the two in one PR (.github/renovate.json5), and that PR
      # fails here until GITLEAKS_SHA256 is updated from the release's
      # gitleaks_<version>_checksums.txt (linux_x64 line).
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      # On a PR, the commits reachable from HEAD but not from the base branch's
      # current tip (fetched by the checkout), as in the other diff-against-base
      # steps. --redact: the finding's location and rule, never the value.
      - name: Scan commits
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # --log-opts replaces gitleaks' own git-log arguments, so the push scan repeats
          # --full-history --all to cover every ref, not only HEAD's history. A merge shows
          # only what it adds over the automatic merge (a conflict resolution), so a line
          # from a parent is reported once, under its own commit, as .gitleaksignore expects.
          # gitleaks scans 0 commits and passes when the range does not resolve.
          range=()
          if [ "$EVENT" = pull_request ]; then
            git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null || { echo "::error::origin/$BASE_REF is not fetched"; exit 1; }
            range=(--log-opts="--diff-merges=remerge origin/$BASE_REF..HEAD")
          else
            range=(--log-opts="--diff-merges=remerge --full-history --all")
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --no-banner "${range[@]}" .
      # The base branch's current tip (fetched by the checkout), as in the other
      # diff-against-base steps.
      - name: Fragment for package changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          skip=()
          if [ "$SKIP" = true ]; then skip=(--skip-label); fi
          python scripts/check_changelog_fragment.py --base "origin/$BASE_REF" --head HEAD "${skip[@]}"
      # Lists the docs pages whose `depends_on` front matter matches a file this PR
      # changes while the PR leaves the page alone, in the job summary and as a
      # warning on each page (scripts/check_docs_review_triggers.py). A prompt to
      # reread the page, not a gate: findings never fail the step (only a malformed
      # depends_on or an undiffable base does). It posts no PR comment. That every
      # glob still matches a file is checked by tests/test_docs_review_triggers.py.
      - name: Docs pages to review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/check_docs_review_triggers.py --base "origin/$BASE_REF" --head HEAD
      # A PR that changes the schemas (dokimi/schemas/) may not narrow an existing
      # schema version in place (dokimi/schema_compat.py says why and what to do
      # instead). A reviewer who has decided a narrowing is safe (it states an
      # invariant every written artifact already met) applies the `schema-break-ok`
      # label; the findings are still printed, the job just does not fail on them.
      # WARNING lines (narrowings no base fixture hits) never fail the step; they go
      # to the step summary and as annotations so a reviewer sees them.
      # Diffs against the base branch's current tip, not base.sha (the base as it
      # stood when the PR was opened), or main's own later edits get blamed on the PR.
      - name: schema_compat vs the PR base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'schema-break-ok') }}
        run: |
          set -o pipefail
          status=0
          python -m dokimi.schema_compat --base "origin/$BASE_REF" | tee compat.txt || status=$?
          if grep -qE '^(BREAKING|WARNING)' compat.txt; then
            { echo '### Schema compatibility'; echo '```'; cat compat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          { grep '^WARNING' compat.txt || true; } | sed 's/^WARNING */::warning title=schema_compat::/'
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$OVERRIDE" = true ]; then
            echo "::warning::breaking schema edits accepted by the schema-break-ok label"
            exit 0
          fi
          exit 1

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dokimi/requirements.lock.txt
      - run: pip install --require-hashes -r requirements.lock.txt -r requirements-ci.lock.txt
      - name: mypy
        run: mypy
      # Dependency hygiene, config in [tool.deptry] of pyproject.toml: an import
      # not declared (DEP001), a runtime dependency never imported (DEP002), an
      # import that only resolves through another package's dependencies (DEP003),
      # a dev-extra tool imported by the package (DEP004). Here, not in `static`:
      # deptry maps import names to packages through the installed lock.
      - name: deptry
        if: ${{ !cancelled() }}
        run: deptry .

  # The test matrix waits for `static` (ubuntu-latest): a PR that fails lint
  # stops there instead of booting the matrix on the pool. That includes the PR-only
  # checks in `static` (the secret scan, the changelog fragment, schema compatibility).
  # A green run waits in both queues in turn. typecheck, one job, still runs alongside `static`;
  # windows-smoke, on windows-latest, does not wait.
  test:
    name: Tests (py${{ matrix.python-version }})
    needs: static
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      # Codecov upload over OIDC, so no upload token is stored. PRs from forks
      # get no ID token; the action detects them and uploads tokenless.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # The coverage leg: it measures coverage, gates the changed lines and
        # uploads the report. scripts/ci_local.py runs its one leg as this one.
        include:
          - python-version: '3.14'
            coverage: true
        # A PR runs the two ends, 3.11 (the floor) and 3.14 (the coverage leg);
        # the middle versions run on main, weekly and on dispatch. A break on
        # 3.12 or 3.13 alone is rare and shows on main right after the merge.
        # Excluded by expression, not by a computed list: ci_local.py reads
        # python-version as a list. On other events the entries match no leg.
        exclude:
          - python-version: ${{ github.event_name == 'pull_request' && '3.12' || 'none' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history on the coverage leg only: the changed-lines gate diffs
          # against the base branch. The other legs need the tree alone.
          fetch-depth: ${{ matrix.coverage && '0' || '1' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dokimi/requirements.lock.txt
      # The lock, not the ranges: a PR's result should not depend on what was
      # released upstream that morning. test-latest below watches the ranges.
      - name: Install deps
        run: pip install --require-hashes -r requirements.lock.txt
      # Offline by construction: pytest-socket (addopts in pyproject.toml) fails
      # any test that opens a network socket. --outcomes also checks the user
      # outcomes in tests/outcomes/: an evidence id that no test claims fails the
      # job even when every test passes. It also checks the journey trace
      # (tests/outcomes/journeys.yaml) and writes the journey coverage report. -n auto: one pytest-xdist worker
      # per CPU. Coverage on the coverage leg only: one report is gated and
      # uploaded, and 3.14 traces through sys.monitoring, where the tracer costs
      # the least (the suite with --cov-branch takes about 40% longer on 3.11-3.13).
      - name: Run tests
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          if [ "$COVERAGE" = true ]; then
            pytest -n auto --outcomes --outcomes-report=outcomes-result.json --journeys-report=journeys-result.json --cov=dokimi --cov-branch --cov-report=term --cov-report=xml
          else
            pytest -n auto --outcomes --outcomes-report=outcomes-result.json --journeys-report=journeys-result.json
          fi
      # Coverage of the lines this PR changes, not of the whole tree: the total
      # moves too little per PR to gate on, an untested new function does not.
      # Below 20 measurable changed lines one missed line swings the percentage
      # by 5+ points, so small PRs get the report without the gate.
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request' && matrix.coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The base branch's current tip (fetched by the checkout), not base.sha
          # (the base when the PR was opened).
          diff-cover coverage.xml --compare-branch="origin/$BASE_REF" \
            --format json:diff-cover.json,markdown:diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, sys
          r = json.load(open("diff-cover.json", encoding="utf-8"))
          lines, pct = r.get("total_num_lines", 0), r.get("total_percent_covered", 100)
          print(f"changed lines measured: {lines}, covered: {pct}%")
          if lines >= 20 and pct < 80:
              sys.exit(f"coverage of changed lines {pct}% < 80% (see the step summary)")
          PY
      - name: Upload coverage
        if: always() && matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            dokimi/coverage.xml
            dokimi/diff-cover.json
            dokimi/diff-cover.md
            dokimi/outcomes-result.json
            dokimi/journeys-result.json
            dokimi/journeys-result.md
          if-no-files-found: ignore
      # Trend, PR comment and badge. Informational only (codecov.yml): the gate
      # is the changed-lines step above, and a Codecov outage does not fail CI.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: dokimi/coverage.xml
          disable_search: true
          use_oidc: true
          # The CLI from PyPI, not cli.codecov.io: on the Intel pool that download
          # ran at about 33 KB/s (5 min for 10 MB), PyPI at several MB/s. Pinned:
          # the action's default is the newest release. Bump by hand.
          use_pypi: true
          version: '11.3.1'

  # Canary for the dependency ranges in requirements*.txt: installs the newest
  # releases they allow and runs the suite. It fails when an upstream release
  # breaks the framework -- the signal to fix the code or the range and then
  # regenerate requirements.lock.txt -- without failing anyone's PR.
  test-latest:
    name: Tests (latest deps, py3.13)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Install newest allowed deps
        run: pip install --upgrade -r requirements.txt -r requirements-test.txt
      - name: Run tests
        run: pytest -q -n auto

  # Installs the built package with a fresh resolve of its dependency ranges, not
  # the lock: the floor version checks what `pip install dokimi` gives a 3.11 user.
  package-smoke:
    name: Package install smoke test (py${{ matrix.python-version }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
        # A PR runs the floor only, which is what this job is for; 3.13 runs on
        # main, weekly and on dispatch (see the test matrix above).
        exclude:
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Downloads and built wheels only: pip still resolves the ranges fresh.
          cache: pip
          cache-dependency-path: dokimi/pyproject.toml
      # `python -m build` makes the sdist and then the wheel from the unpacked
      # sdist, so a file missing from either is missing from the wheel.
      - name: Build sdist and wheel
        run: |
          # The tools go in their own venv: pinned into this interpreter, the lock's
          # PyYAML and jsonschema would be kept when the wheel is installed below.
          # --no-isolation: the backend is the lock's setuptools, not a fresh unhashed resolve.
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --require-hashes -r requirements-ci.lock.txt
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/build-venv/bin/twine" check --strict "$RUNNER_TEMP"/dist/*
      - name: Install the wheel
        run: pip install "$RUNNER_TEMP"/dist/*.whl
      # From outside the checkout, so `import dokimi` gets the installed wheel
      # and not the source tree in the working directory.
      - name: Smoke-test the installed wheel
        run: |
          smoke="$PWD/scripts/smoke_installed.py"
          cd "$RUNNER_TEMP" && python "$smoke"

  # Windows sanity check, not a full validation: the wheel builds, installs and
  # passes the installed-package smoke test, and a few fast unit tests run. It
  # catches path, encoding and console breakage on Windows without paying for
  # the whole suite on a slower runner. GitHub-hosted: the Intel pool has no
  # Windows runners.
  windows-smoke:
    name: Windows smoke test (py3.13)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: dokimi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dokimi/requirements.lock.txt
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m pip install "$RUNNER_TEMP"/dist/*.whl
      - name: Smoke-test the installed wheel
        run: |
          smoke="$PWD/scripts/smoke_installed.py"
          cd "$RUNNER_TEMP" && python "$smoke"
      - name: Install test deps
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Run a few fast tests
        run: pytest -q tests/test_cli_help.py tests/test_console_encoding.py
