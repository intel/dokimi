name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the unpinned-dependency canary (test-latest) runs only here.
    - cron: '17 5 * * 1'

permissions:
  contents: read

# Runners: every PR check runs on intel-ubuntu-latest, Intel's ephemeral runner
# pool, the seconds-long `static` job too. ubuntu-latest is shared by every
# intel/ repository: a job there waited 28 min or more for a runner one time in
# ten (October 2026), and a PR's CI finishes when its last job does. The pool
# boots a runner per job, a wait of about 4 min (median), p90 8 min. Both ends
# of a `needs:` chain are on the pool (`changes` -> external-catalog-smoke in
# agent-quality.yml, `build` -> `deploy` in docs.yml), so no chain waits on both
# queues. Fork PRs against intel/dokimi run on the pool as well
# (repository_owner is the base repository's); an outside contributor's runs
# need a maintainer's approval first. A fork's own pushes fall back to
# ubuntu-latest. release.yml and stack-health.yml, not PR checks, stay on
# ubuntu-latest. windows-smoke, a PR check, runs on windows-latest.

# A new push to a PR supersedes the run in flight. Every other run gets a group of its
# own (run_id): in a shared group a third queued run cancels the pending second one
# even with cancel-in-progress false, so pushes to main would be dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: dokimi

# Single-version jobs (here, in agent-quality.yml, contracts.yml, docs.yml and
# stack-health.yml) and `make dev` use Python 3.13, not 3.14: scikit-network
# (pulled in by ragas) has no cp314 wheels yet, so on 3.14 every install builds
# it from source (C++ with OpenMP, unpinned build deps); the pip cache keeps the
# built wheel for the 3.14 test leg. Move them to 3.14 once scikit-network ships
# cp314 wheels.
jobs:
  # The checks that need no dependency lock, in one job: each takes seconds, and
  # as separate jobs each waited for a runner of its own. Every step after the
  # install runs even when an earlier one fails (!cancelled()), so one finding
  # does not hide the next.
  static:
    name: Static checks (ruff, schema, zizmor, license headers, pre-commit, bandit, pip-audit)
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      # The tools, hash-locked in dokimi/requirements-ci.lock.txt (input:
      # requirements-ci.txt, which says why ruff is an exact pin). Every install
      # from a lock passes --require-hashes, so a tampered or re-uploaded
      # artifact fails the install.
      - name: Install tools
        run: pip install --require-hashes -r requirements-ci.lock.txt
      # Lint only: most of the tree predates the formatter (205 of 276 files would
      # be rewritten), so a format gate would mean a repo-wide reformat first.
      - name: ruff check
        if: ${{ !cancelled() }}
        run: ruff check .
      - name: schema-check
        if: ${{ !cancelled() }}
        run: python -m dokimi.schema_check benchmarks/spec.v1.yaml
      - name: registry-drift-check
        if: ${{ !cancelled() }}
        run: python -m dokimi.config_check
      - name: guidance self-scan (L0)
        if: ${{ !cancelled() }}
        run: python cli.py repo scan .. --manifest-file benchmarks/self-scan.repo-eval.yaml --fail-on-fail
      # Static audit of the workflow files: unpinned actions, template injection,
      # credential persistence, over-broad token permissions.
      - name: zizmor
        if: ${{ !cancelled() }}
        working-directory: .
        run: zizmor --offline --min-severity medium .github/workflows
      # Every tracked file carries the SPDX license header; scope and exceptions
      # are in .github/.licenserc.yaml. A `uses:` step, so `make ci-local` skips
      # it (the config's header comment has the docker command for a local run).
      # The released image, not the apache/skywalking-eyes/header action, which
      # installs Go and builds license-eye on every run. Log level error: the
      # pattern-only config makes info level warn once per file type about a
      # missing license template; invalid files are still listed at error.
      - name: License header check
        if: ${{ !cancelled() }}
        uses: docker://apache/skywalking-eyes:0.9.0@sha256:cd89ccbbcba2e87d3fb0e34b156b1da208d6c5ac1ada4e2d335e920022c765b8
        with:
          args: -v error -c .github/.licenserc.yaml header check
      # The hooks in .pre-commit-config.yaml, so they stay green on main: a change
      # that fails one fails here, not on the next contributor's commit. ruff-check
      # and zizmor are skipped: the steps above run the same versions. gitleaks
      # checks staged changes only, so it has nothing to do here; gitleaks.yml
      # scans the PR's commits.
      - name: pre-commit
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          SKIP: ruff-check,zizmor,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color always
      # bandit and pip-audit hold the baseline SECURITY.md describes: no
      # Medium/High Bandit finding, and no dependency advisory beyond the ones it
      # lists.
      - name: bandit
        if: ${{ !cancelled() }}
        run: bandit -r . -ll -q
      # The locks are the full closure (requirements-docs.lock.txt for the
      # documentation site, requirements-ci.lock.txt for the tools), so --no-deps --disable-pip audits them as written
      # without resolving or installing anything. Each --ignore-vuln is
      # an advisory SECURITY.md documents and dokimi/osv-scanner.toml ignores;
      # add or drop them together, in all three.
      # pip-audit skips a pin whose marker is false on this 3.13 runner (the
      # pins for older interpreters, for one), so markers are stripped, a pin
      # the locks share is kept once, a name pinned twice goes to a second file,
      # and the trailing `\` of a hashed pin is dropped (its --hash lines are skipped).
      - name: pip-audit
        if: ${{ !cancelled() }}
        run: |
          sed -e 's/ *\\$//' -e 's/ *;.*//' \
              requirements.lock.txt requirements-docs.lock.txt requirements-ci.lock.txt | sort -u \
            | awk -F'==' '/^[A-Za-z0-9]/ { print > (ENVIRON["RUNNER_TEMP"] "/pins" seen[$1]++ ".txt") }'
          for f in "$RUNNER_TEMP"/pins*.txt; do
            pip-audit -r "$f" --no-deps --disable-pip --progress-spinner off \
              --ignore-vuln PYSEC-2026-2447 \
              --ignore-vuln PYSEC-2026-3046
          done

  typecheck:
    name: mypy
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dokimi/requirements.lock.txt
      - run: pip install --require-hashes -r requirements.lock.txt -r requirements-ci.lock.txt
      - name: mypy
        run: mypy
      # Dependency hygiene, config in [tool.deptry] of pyproject.toml: an import
      # not declared (DEP001), a runtime dependency never imported (DEP002), an
      # import that only resolves through another package's dependencies (DEP003),
      # a dev-extra tool imported by the package (DEP004). Here, not in `static`:
      # deptry maps import names to packages through the installed lock.
      - name: deptry
        if: ${{ !cancelled() }}
        run: deptry .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      # Codecov upload over OIDC, so no upload token is stored. PRs from forks
      # get no ID token; the action detects them and uploads tokenless.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # The coverage leg: it measures coverage, gates the changed lines and
        # uploads the report. scripts/ci_local.py runs its one leg as this one.
        include:
          - python-version: '3.14'
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dokimi/requirements.lock.txt
      # The lock, not the ranges: a PR's result should not depend on what was
      # released upstream that morning. test-latest below watches the ranges.
      - name: Install deps
        run: pip install --require-hashes -r requirements.lock.txt
      # Offline by construction: pytest-socket (addopts in pyproject.toml) fails
      # any test that opens a network socket. --outcomes also checks the user
      # outcomes in tests/outcomes/: an evidence id that no test claims fails the
      # job even when every test passes. -n auto: one pytest-xdist worker
      # per CPU. Coverage on the coverage leg only: one report is gated and
      # uploaded, and 3.14 traces through sys.monitoring, where the tracer costs
      # the least (the suite with --cov-branch takes about 40% longer on 3.11-3.13).
      - name: Run tests
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          if [ "$COVERAGE" = true ]; then
            pytest -n auto --outcomes --outcomes-report=outcomes-result.json --cov=dokimi --cov-branch --cov-report=term --cov-report=xml
          else
            pytest -n auto --outcomes --outcomes-report=outcomes-result.json
          fi
      # Coverage of the lines this PR changes, not of the whole tree: the total
      # moves too little per PR to gate on, an untested new function does not.
      # Below 20 measurable changed lines one missed line swings the percentage
      # by 5+ points, so small PRs get the report without the gate.
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request' && matrix.coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The base branch's current tip (fetched by the checkout), not base.sha
          # (the base when the PR was opened).
          diff-cover coverage.xml --compare-branch="origin/$BASE_REF" \
            --format json:diff-cover.json,markdown:diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, sys
          r = json.load(open("diff-cover.json", encoding="utf-8"))
          lines, pct = r.get("total_num_lines", 0), r.get("total_percent_covered", 100)
          print(f"changed lines measured: {lines}, covered: {pct}%")
          if lines >= 20 and pct < 80:
              sys.exit(f"coverage of changed lines {pct}% < 80% (see the step summary)")
          PY
      - name: Upload coverage
        if: always() && matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            dokimi/coverage.xml
            dokimi/diff-cover.json
            dokimi/diff-cover.md
            dokimi/outcomes-result.json
          if-no-files-found: ignore
      # Trend, PR comment and badge. Informational only (codecov.yml): the gate
      # is the changed-lines step above, and a Codecov outage does not fail CI.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: dokimi/coverage.xml
          disable_search: true
          use_oidc: true
          # The CLI from PyPI, not cli.codecov.io: on the Intel pool that download
          # ran at about 33 KB/s (5 min for 10 MB), PyPI at several MB/s. Pinned:
          # the action's default is the newest release. Bump by hand.
          use_pypi: true
          version: '11.3.1'

  # Canary for the dependency ranges in requirements*.txt: installs the newest
  # releases they allow and runs the suite. It fails when an upstream release
  # breaks the framework -- the signal to fix the code or the range and then
  # regenerate requirements.lock.txt -- without failing anyone's PR.
  test-latest:
    name: Tests (latest deps, py3.13)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Install newest allowed deps
        run: pip install --upgrade -r requirements.txt -r requirements-test.txt
      - name: Run tests
        run: pytest -q -n auto

  # Installs the built package with a fresh resolve of its dependency ranges, not
  # the lock: the floor version checks what `pip install dokimi` gives a 3.11 user.
  package-smoke:
    name: Package install smoke test (py${{ matrix.python-version }})
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Downloads and built wheels only: pip still resolves the ranges fresh.
          cache: pip
          cache-dependency-path: dokimi/pyproject.toml
      # `python -m build` makes the sdist and then the wheel from the unpacked
      # sdist, so a file missing from either is missing from the wheel.
      - name: Build sdist and wheel
        run: |
          # The tools go in their own venv: pinned into this interpreter, the lock's
          # PyYAML and jsonschema would be kept when the wheel is installed below.
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --require-hashes -r requirements-ci.lock.txt
          "$RUNNER_TEMP/build-venv/bin/python" -m build --outdir "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/build-venv/bin/twine" check --strict "$RUNNER_TEMP"/dist/*
      - name: Install the wheel
        run: pip install "$RUNNER_TEMP"/dist/*.whl
      # From outside the checkout, so `import dokimi` gets the installed wheel
      # and not the source tree in the working directory.
      - name: Smoke-test the installed wheel
        run: |
          smoke="$PWD/scripts/smoke_installed.py"
          cd "$RUNNER_TEMP" && python "$smoke"

  # Windows sanity check, not a full validation: the wheel builds, installs and
  # passes the installed-package smoke test, and a few fast unit tests run. It
  # catches path, encoding and console breakage on Windows without paying for
  # the whole suite on a slower runner. GitHub-hosted: the Intel pool has no
  # Windows runners.
  windows-smoke:
    name: Windows smoke test (py3.13)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: dokimi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dokimi/requirements.lock.txt
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m pip install "$RUNNER_TEMP"/dist/*.whl
      - name: Smoke-test the installed wheel
        run: |
          smoke="$PWD/scripts/smoke_installed.py"
          cd "$RUNNER_TEMP" && python "$smoke"
      - name: Install test deps
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Run a few fast tests
        run: pytest -q tests/test_cli_help.py tests/test_console_encoding.py
