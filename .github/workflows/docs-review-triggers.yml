name: docs-review-triggers

# Lists the docs pages whose `depends_on` front matter matches a file this PR
# changes while the PR leaves the page alone, in the job summary and as a
# warning on each page (scripts/check_docs_review_triggers.py). A prompt to
# reread the page, not a gate: findings never fail the job (only a malformed
# depends_on or an undiffable base does). It posts no PR comment, so a fork PR's read-only token is enough. That every glob still
# matches a file is checked by tests/test_docs_review_triggers.py in ci.yml.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dokimi

# intel-ubuntu-latest: see ci.yml.
jobs:
  triggers:
    name: Docs review triggers
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Install PyYAML
        run: pip install PyYAML
      # The base branch's current tip (fetched by the checkout), as in changelog.yml.
      - name: Pages to review
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/check_docs_review_triggers.py --base "origin/$BASE_REF" --head HEAD
