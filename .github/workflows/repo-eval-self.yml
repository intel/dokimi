name: repo-eval-self

# Scan guidance, check changed tasks and smoke-test harness edits using this commit's Dokimi.
# Manual dispatch checks every task by default.
on:
  pull_request:
    paths:
      - '.agent-eval/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'REVIEW.md'
      - '.github/copilot-instructions.md'
      - 'dokimi/dokimi/repos/**'
      - 'dokimi/dokimi/commands/repo*.py'
      - 'dokimi/dokimi/schemas/repo_*.json'
      - 'dokimi/requirements.lock.txt'
      - 'dokimi/pyproject.toml'
      - '.github/workflows/repo-eval.yml'
      - '.github/workflows/repo-eval-self.yml'
      - 'actions/**'
  workflow_dispatch:
    inputs:
      tasks:
        description: "`all`, or task ids separated by spaces or commas"
        required: false
        default: all

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self:
    permissions:
      contents: read
    uses: ./.github/workflows/repo-eval.yml
    with:
      # The commit under test: the merge commit on a pull request.
      dokimi-ref: ${{ github.sha }}
      dokimi-repository: ${{ github.repository }}
      dokimi-action-repository: ${{ github.repository }}
      manifest: .agent-eval/repo-eval.yaml
      tasks: ${{ inputs.tasks || 'changed' }}
      smoke-tasks: fix-degrade-pre review-pr-conventions review-clean-diff
      # Harness changes select the smoke set. Guidance-only edits still run the scan.
      smoke-paths: >-
        dokimi/dokimi/repos/ dokimi/dokimi/commands/repo dokimi/dokimi/schemas/repo_
        dokimi/requirements.lock.txt dokimi/pyproject.toml
        .github/workflows/repo-eval.yml .github/workflows/repo-eval-self.yml actions/
      max-parallel: 4
      # Runners: see the header of ci.yml.
      runs-on: ${{ github.repository_owner == 'intel' && github.event_name == 'pull_request' && vars.LINUX_RUNNER_OFF != 'true' && 'dokimi-ec2' || 'ubuntu-latest' }}
      timeout-minutes: 60
