name: changelog

# A PR that changes the package (dokimi/dokimi/**), dokimi/data/** or what
# installing it gives a user ([project] and [tool.setuptools] of
# dokimi/pyproject.toml) adds a changelog fragment under dokimi/changelog.d/ instead of editing CHANGELOG.md, so open PRs never
# conflict there (dokimi/changelog.d/README.md). The skip-changelog label, for
# a change with no user-visible effect, turns the check off.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dokimi

# intel-ubuntu-latest: see ci.yml.
jobs:
  fragment:
    name: Changelog fragment
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      # The base branch's current tip (fetched by the checkout), as in the
      # other diff-against-base steps.
      - name: Fragment for package changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          skip=()
          if [ "$SKIP" = true ]; then skip=(--skip-label); fi
          python scripts/check_changelog_fragment.py --base "origin/$BASE_REF" --head HEAD "${skip[@]}"
