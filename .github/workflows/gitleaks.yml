name: gitleaks

# Secret scan of git history with the gitleaks CLI: on a PR, the commits it
# adds over the base branch (a secret committed and then deleted is still in
# them); on a push to main, the whole history (seconds: about 280 commits).
# The CLI, not gitleaks/gitleaks-action: the action needs a license key for
# repositories owned by an organization, and is under its own license.
#
# The findings are redacted in the log, which is public. A false positive (a
# test fixture, a placeholder key): append `gitleaks:allow` in a comment on the
# line, or allowlist it in a `.gitleaks.toml` at the repo root (gitleaks reads
# it on its own; start it with `[extend] useDefault = true`), path plus rule or
# regex, with the reason. A finding in a commit already on main goes in
# `.gitleaksignore` by its fingerprint (printed with each finding).
# A real secret: revoke it first; deleting it from the tree does not remove it
# from history or from the copies forks and clones already have.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# intel-ubuntu-latest: see ci.yml.
jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The release tarball, checked against a SHA-256 kept here rather than the
      # release's own checksums file, which comes from the same place as the
      # tarball. The version is the gitleaks rev in .pre-commit-config.yaml;
      # Renovate bumps the two in one PR (.github/renovate.json5), and that PR
      # fails here until GITLEAKS_SHA256 is updated from the release's
      # gitleaks_<version>_checksums.txt (linux_x64 line).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      # On a PR, the commits reachable from HEAD but not from the base branch's
      # current tip (fetched by the checkout), as in the other diff-against-base
      # steps. --redact: the finding's location and rule, never the value.
      - name: Scan commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          range=()
          # --log-opts replaces gitleaks' own git-log arguments, so the push scan repeats
          # --full-history --all to cover every ref, not only HEAD's history. A merge shows
          # only what it adds over the automatic merge (a conflict resolution), so a line
          # from a parent is reported once, under its own commit, as .gitleaksignore expects.
          if [ "$EVENT" = pull_request ]; then range=(--log-opts="--diff-merges=remerge origin/$BASE_REF..HEAD"); else range=(--log-opts="--diff-merges=remerge --full-history --all"); fi
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --no-banner "${range[@]}" .
