name: contracts

# Artifact schemas are versions: an in-place edit to <kind>.v<N>.json may only
# widen what it accepts (dokimi/schema_compat.py says why and what to
# do instead). The fixture half of the contract runs in the test suite
# (tests/test_schema_compat.py); this job is the diff half, which needs the
# PR's base.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'dokimi/dokimi/schemas/**'
      - 'dokimi/dokimi/schema_compat.py'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dokimi

jobs:
  schema-compat:
    name: Schema compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      # A reviewer who has decided a narrowing is safe (it states an invariant
      # every written artifact already met) applies the `schema-break-ok` label;
      # the findings are still printed, the job just does not fail on them.
      # WARNING lines (narrowings no base fixture hits) never fail the job; they
      # go to the step summary and as annotations so a reviewer sees them.
      # pull_request.base.sha is the base as it stood when the PR was opened. The
      # merge commit under test sits on the base branch's current tip (fetched by
      # the checkout above), so diff against that, or main's own later edits get
      # blamed on the PR.
      - name: schema_compat vs the PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'schema-break-ok') }}
        run: |
          set -o pipefail
          status=0
          python -m dokimi.schema_compat --base "origin/$BASE_REF" | tee compat.txt || status=$?
          if grep -qE '^(BREAKING|WARNING)' compat.txt; then
            { echo '### Schema compatibility'; echo '```'; cat compat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          { grep '^WARNING' compat.txt || true; } | sed 's/^WARNING */::warning title=schema_compat::/'
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$OVERRIDE" = true ]; then
            echo "::warning::breaking schema edits accepted by the schema-break-ok label"
            exit 0
          fi
          exit 1
