# The fast, offline subset of the PR checks, run on the files a commit stages.
# Install: `pip install pre-commit && pre-commit install` (see dokimi/CONTRIBUTING.md).
# mypy and pytest need the full environment and take minutes: `make ci-local`.
#
# Each rev is a commit SHA with its tag in the `# frozen:` comment (what
# `pre-commit autoupdate --freeze` writes); Renovate's pre-commit manager
# bumps both. The ruff and zizmor revs are the versions dokimi/requirements-ci.txt
# pins for the tools lock CI installs (ruff's is also the dev extra's), the gitleaks
# rev the version ci.yml's static job downloads, and Renovate updates each tool's pins in
# one PR (.github/renovate.json5).
#
# Not here, measured on the tree this was added to: end-of-file-fixer and
# trailing-whitespace (they would rewrite 29 files, several touched by open
# PRs), codespell and typos (every finding was an identifier or a test input:
# `unparseable`, `ttest`, `ans`, deliberate misspellings).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
    hooks:
      # Lint only, like the CI job. Ruff reads dokimi/pyproject.toml, the closest
      # config to each file, so extend-exclude and per-file-target-version
      # resolve from dokimi/ as they do for `ruff check .` there.
      - id: ruff-check

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
        # Python tags (!!python/...) for the Markdown extensions; the safe
        # loader rejects them. `mkdocs build --strict` (docs.yml) parses it.
        exclude: ^dokimi/mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
        # Outside a merge the hook checks nothing; this makes it check always,
        # so CI catches a conflict marker committed by mistake.
        args: [--assume-in-merge]
      - id: check-added-large-files
        # Every file, not only newly added ones (500 KB limit), so CI checks too.
        args: [--enforce-all]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      # The static job's zizmor step: the same command and scope.
      - id: zizmor
        args: [--no-progress, --offline, --min-severity, medium]
        files: ^\.github/workflows/[^/]+\.ya?ml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # The staged changes of a commit, redacted output (the hook's own entry).
      # The first run builds gitleaks with Go (pre-commit fetches the
      # toolchain), about 20 s; then well under a second per commit. CI skips
      # it: there is nothing staged there, and the Scan commits step in ci.yml scans the commits.
      - id: gitleaks
