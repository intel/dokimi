name: dokimi report
description: >-
  Places the summary of every cli_output.v1 document in out-dir: runs
  `dokimi report summary`, appends its Markdown to the job summary, prints its
  annotations, optionally keeps one sticky PR comment, and uploads out-dir. No
  parsing and no verdict in YAML: the gate stays the exit code of each dokimi
  step. Needs `contents: read`; `pull-requests: write` only with comment: sticky.
  Run it after actions/setup, with `if: always()`.

inputs:
  out-dir:
    description: >-
      Directory holding the cli_output.v1 documents (`*.json`, not recursive), usually
      the out-dir output of actions/setup. Every top-level `*.json` there must be a
      cli_output.v1 document, else it is an `invalid` row; other files (a receipt, a
      `--out` result) go in a subdirectory. A directory with no `*.json` file fails this
      step (exit 2); the step creates a missing `out-dir`, so it fails the same way.
      The rendered summary goes to its `summary/` subdirectory.
    required: true
  comment:
    description: "false, or sticky: create or update one comment on the pull request"
    required: false
    default: 'false'
  github-token:
    description: Token for the sticky comment (needs pull-requests write)
    required: false
    default: ${{ github.token }}
  artifact-name:
    description: Name of the uploaded out-dir artifact; empty skips the upload
    required: false
    default: dokimi-report

runs:
  using: composite
  steps:
    - name: Render the summary
      id: render
      shell: bash
      env:
        OUT: ${{ inputs.out-dir }}
      run: |
        if ! command -v dokimi >/dev/null; then
          echo "::error title=dokimi report::dokimi is not on PATH; run intel/dokimi/actions/setup first"
          exit 1
        fi
        mkdir -p -- "$OUT/summary"
        dokimi report summary --format markdown --out "$OUT/summary/summary.md" -- "$OUT"
        dokimi report summary --format json --out "$OUT/summary/summary.json" -- "$OUT"
        dokimi report summary --format annotations -- "$OUT"
        cat -- "$OUT/summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Sticky pull request comment
      if: ${{ !cancelled() && inputs.comment == 'sticky' && github.event.pull_request.number }}
      shell: bash
      env:
        OUT: ${{ inputs.out-dir }}
        RENDER_OUTCOME: ${{ steps.render.outcome }}
        GH_TOKEN: ${{ inputs.github-token }}
        DEFAULT_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        marker='<!-- dokimi-report -->'
        # A comment body is capped at 65,536 characters: cut the summary below it and point to the job summary.
        mkdir -p -- "$OUT/summary"
        {
          echo "$marker"
          if [ "$RENDER_OUTCOME" != success ]; then
            printf '\nDokimi could not render a summary for this run. See the **Render the summary** step for details.\n'
          else
            head -c 60000 -- "$OUT/summary/summary.md"
            if [ "$(wc -c < "$OUT/summary/summary.md")" -gt 60000 ]; then
              printf '\n\n_Summary cut here; the full one is in the job summary._\n'
            fi
          fi
        } > "$OUT/summary/comment.md"
        # The comment is the token's own: a user token posts as that user, the default token as the bot.
        # Any other token whose login cannot be read (an app installation token) is refused, not guessed.
        if [ "$GH_TOKEN" = "$DEFAULT_TOKEN" ]; then
          me='github-actions[bot]'
        else
          me=$(gh api user --jq .login 2>/dev/null) || {
            echo "::error title=dokimi report::github-token has no readable user login (an app installation token?); use the default token or a user token"
            exit 1
          }
        fi
        # A failed lookup is not proof that no comment exists: skip publishing instead of posting a duplicate.
        ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
          --jq ".[] | select(.user.login == \"$me\" and (.body | startswith(\"$marker\"))) | .id") || {
          echo "::warning title=dokimi report::the sticky comment lookup failed; the summary is in the job summary"
          exit 0
        }
        id=$(printf '%s\n' "$ids" | head -n1)
        # A token that cannot write (a pull request from a fork) must not turn a green job red.
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$OUT/summary/comment.md" >/dev/null ||
            echo "::warning title=dokimi report::the sticky comment could not be updated; the summary is in the job summary"
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$OUT/summary/comment.md" >/dev/null ||
            echo "::warning title=dokimi report::the sticky comment could not be posted; the summary is in the job summary"
        fi
    - name: Upload out-dir
      if: ${{ always() && inputs.artifact-name != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out-dir }}
        if-no-files-found: ignore
