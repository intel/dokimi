name: dokimi setup
description: >-
  Installs dokimi at one pinned commit (a SHA, or a release tag resolved to its
  commit; a branch is refused) with its locked dependencies, sets up Python, and
  exports CI=true. Needs no secret. Callers grant `contents: read` at most.

inputs:
  dokimi-ref:
    description: >-
      dokimi commit SHA (40 hex digits) or release tag to install. Use the ref of the
      `uses:` line that pins this action; a branch is refused.
    required: true
  dokimi-repository:
    description: Repository dokimi-ref is in (owner/name), for installing a fork's package
    required: false
    default: intel/dokimi
  python-version:
    description: Python the install and the checks run under
    required: false
    default: '3.13'
  out-dir:
    description: >-
      Directory for the run output, created by this action; empty means
      `$RUNNER_TEMP/dokimi-out`. The caller writes its output under it, and uploads the
      whole directory as an artifact.
    required: false
    default: ''

outputs:
  sha:
    description: The commit installed (40 hex digits)
    value: ${{ steps.ref.outputs.sha }}
  out-dir:
    description: Absolute path of the output directory, to upload
    value: ${{ steps.out.outputs.dir }}

runs:
  using: composite
  steps:
    # Resolves the ref before anything is installed: a tag becomes the commit it names
    # (the peeled line of ls-remote), so the jobs of one run install the same commit.
    - name: Resolve dokimi-ref
      id: ref
      shell: bash
      env:
        REF: ${{ inputs.dokimi-ref }}
        DOKIMI_REPO: ${{ inputs.dokimi-repository }}
      run: |
        if ! [[ "$DOKIMI_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
          echo "::error title=dokimi-repository::dokimi-repository is not owner/name"
          exit 1
        fi
        if [[ "$REF" =~ ^[0-9A-Fa-f]{40}$ ]]; then
          sha=${REF,,}
        elif [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]*$ ]]; then
          # An annotated tag's commit is its peeled (^{}) line.
          sha=$(git ls-remote --tags "https://github.com/$DOKIMI_REPO" \
                | awk -v t="refs/tags/$REF" '$2 == t "^{}" { p = $1 } $2 == t { l = $1 } END { print (p != "" ? p : l) }')
        fi
        if ! [[ "${sha:-}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error title=dokimi-ref::dokimi-ref is neither a 40-digit commit SHA nor a tag of $DOKIMI_REPO"
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "dokimi $DOKIMI_REPO@$REF -> $sha"

    # No pip cache: a cache restored in a run that checks out the caller's dokimi-ref
    # is the poisoning path CodeQL flags (actions/cache-poisoning/poisonable-step).
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dokimi
      shell: bash
      env:
        SHA: ${{ steps.ref.outputs.sha }}
        DOKIMI_REPO: ${{ inputs.dokimi-repository }}
      run: |
        # The lock is hashed, and pip cannot hash a git URL: install the lock, then dokimi without deps.
        pip install --require-hashes -r "https://raw.githubusercontent.com/$DOKIMI_REPO/$SHA/dokimi/requirements.lock.txt"
        pip install --no-deps "dokimi @ git+https://github.com/$DOKIMI_REPO@$SHA#subdirectory=dokimi"

    - name: Output directory and environment
      id: out
      shell: bash
      env:
        OUT: ${{ inputs.out-dir }}
      run: | # zizmor: ignore[github-env] -- intended: the only value written to GITHUB_ENV is the constant CI=true
        out=${OUT:-$RUNNER_TEMP/dokimi-out}
        # Refused before mkdir, so a newline name is never created.
        if [[ "$out" == *$'\n'* ]]; then echo "::error title=out-dir::out-dir has a newline"; exit 1; fi
        # A relative path gets ./ so that a lone - is the directory, not cd's OLDPWD shorthand.
        [[ "$out" == /* ]] || out=./$out
        mkdir -p -- "$out"
        # The x keeps a newline at the end of $PWD from being stripped by the command substitution.
        dir=$(cd -- "$out" && printf '%sx' "$PWD"); dir=${dir%x}
        if [[ "$dir" == *$'\n'* ]]; then echo "::error title=out-dir::out-dir has a newline"; exit 1; fi
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "CI=true" >> "$GITHUB_ENV"
