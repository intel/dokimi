# Runtime configuration for the LLM evaluation track: which models answer,
# judge and generate, how questions are generated, how answers are scored, and
# how documentation is retrieved. Every block below is read at run time.
#
# Product *identity* (name, description, repo, context7_id, doc sources) lives
# in the `products.yaml` registry next to this directory and is not restated here.
#
# An optional `products:` block is still honoured, for a caller who keeps
# eval-track overrides per product:
#
#   products:
#     <product>:
#       github_repo: "<org>/<repo>"   # checked against products.yaml
#       default_personas: 5
#
# `python -m dokimi.config_check` (run in CI) reports drift when a
# product declared in both files disagrees on the GitHub repo; the top-level
# products.yaml is canonical.

# Context7 MCP configuration
context7:
  endpoint: "https://mcp.context7.com/mcp"
  timeout: 30
  max_retries: 3

# LLM configuration. The defaults mirror dokimi/defaults.py (a test pins them
# together); changed 2026-10-13, so default-flag scores from before are not comparable.
llm:
  # Model for answering questions
  answerer:
    default: "gpt-6.1-sol"
    alternatives: ["gpt-6-astra", "claude-sonnet-5-5", "claude-opus-5-5"]

  # Model for judging answers (a different family from the answerer, to avoid bias)
  judge:
    default: "claude-sonnet-5-5"
    alternatives: ["claude-opus-5-5", "gpt-6-astra"]

  # Model for persona/question generation
  generator:
    default: "gpt-6.1-sol"
    alternatives: ["gpt-6-luna", "claude-sonnet-5-5", "claude-haiku-5-5"]

# Question generation settings
questions:
  target_per_persona: 8
  difficulty_distribution:
    beginner: 2
    intermediate: 3
    advanced: 3
  validation_threshold: 60  # 0-100 score
  dedupe_similarity_threshold: 0.85  # cosine similarity

# Evaluation settings
evaluation:
  dimensions:
    - correctness
    - completeness
    - specificity
    - code_quality
    - actionability
  scale: 100  # 0-100 scoring
  gap_threshold: 70  # Scores below this indicate doc gaps

# Retrieval / scan strategy
# Decision (2026-03-04): single fixed configuration, no multi-config comparisons.
retrieval:
  strategy: semantic          # semantic only — no keyword or hybrid variants
  top_k: 3                   # fixed; do not run comparative top_k experiments
  comparison_axis: with_docs_vs_without_docs  # only valid comparison axis
