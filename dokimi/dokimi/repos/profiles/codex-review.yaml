schema: harness_profile.v1
name: codex-review
bin: codex  # the native binary, as for the codex profile
version_cmd: ["{bin}", "--version"]
# Codex 0.160 runs every tool call through codex-code-mode-host, which it starts from
# beside its own binary; without it in the container no command can run.
bin_companions: [codex-code-mode-host]
# Codex's own review mode on the commit under review (a review task's review_patch is
# the workspace HEAD). `--commit` refuses a custom prompt, so the task prompt is not
# passed (native_prompt) and the answer is Codex's review text, which answer_format
# turns into the findings block a review grader reads. Use it on review tasks only.
# The tool mode goes before `review`: --sandbox is an `exec` option that review rejects.
invoke:
  - "{bin}"
  - "exec"
  - "{tools}"
  - "review"
  - "--commit"
  - "HEAD"
  - "--model"
  - "{model}"
  - "--ephemeral"
  - "--skip-git-repo-check"
  - "--json"
native_prompt: true
answer_format: codex-review
tools:
  none: ["--sandbox", "read-only"]
  read: ["--sandbox", "read-only"]
  all: ["--dangerously-bypass-approvals-and-sandbox"]
config_dir_env: CODEX_HOME
env_allow:
  - PATH
  - HOME
  - LANG
  - SYSTEMROOT
  - CODEX_API_KEY
  # `codex exec` reads neither OPENAI_API_KEY nor OPENAI_BASE_URL (they are forwarded for
  # a profile copy that uses them), and nothing in dokimi reads endpoint_env, so setting
  # OPENAI_BASE_URL does not redirect Codex. Another endpoint is routed with a provider in
  # config_files (config.toml), and the provider must name the variable that holds its key:
  # `env_key = "CODEX_API_KEY"`. Without env_key Codex sends no Authorization header
  # (401 "Missing bearer").
  - OPENAI_API_KEY
  - OPENAI_BASE_URL
  - http_proxy
  - https_proxy
  - no_proxy
  - HTTP_PROXY
  - HTTPS_PROXY
  - NO_PROXY
egress:
  - api.openai.com
endpoint_env: OPENAI_BASE_URL
trace: codex-json
guidance:
  names: [AGENTS.md, AGENTS.override.md]
  resolution: codex-home + git-root-to-cwd + lazy-by-shell-read
  imports: null
  notes: >-
    Loads guidance as the codex profile does. Measured on 0.160 with gpt-6-luna:
    it opened AGENTS.md but reported only defects its P0-P3 rubric keeps;
    convention rules moved it only when the guidance called a violation
    merge-blocking (P1). It reports zero token usage in this mode.
