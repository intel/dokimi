[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dokimi"
version = "0.1.0"
description = "Measures whether a skill, MCP doc source, documentation set or agent profile actually improves AI-agent answers and task outcomes"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Intel Corporation" }]
keywords = ["documentation", "benchmark", "evaluation", "llm", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.1,<7",
  "jsonschema>=4.20,<5",
  "litellm>=1.105.0",
  "httpx>=0.27.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "PyGithub>=2.1.0",
  "datasets>=2.20,<6",
  "openai>=1.51,<3",
]

[project.optional-dependencies]
dev = [
  # 9.0.3 fixes PYSEC-2026-1845; a lower floor lets a resolver pick an affected pytest.
  "pytest>=9.0.3",
  # Property-based tests (tests/test_arm_specs_properties.py).
  "hypothesis>=6.100",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-socket>=0.7",
  "pytest-timeout>=2.2",
  "pytest-randomly>=3.15",
  "pytest-xdist>=3.6",
  "diff-cover>=10.0",
  "ruff==0.17.0",
  "mypy>=1.8",
  "types-PyYAML",
  "types-jsonschema",
  "scriv>=1.5",
  # The test suite covers eval ragas.
  "dokimi[ragas]",
]
# `eval ragas` and `answers generate --ragas`.
ragas = [
  "ragas>=0.3.0,<0.4",
  # Every ragas release imports langchain_community.chat_models.vertexai, which 0.4.2 removed.
  "langchain-community<0.4.2",
  # eval ragas wraps the judge in ChatOpenAI or ChatAnthropic, typed as langchain-core's BaseChatModel.
  "langchain-anthropic>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-core>=1.0,<2",
]
ocr = ["docling>=2.0"]
mcp = ["mcp>=1.0"]
embeddings = ["sentence-transformers>=2.2"]
# Optional local baseline arm for `eval judge-validity --scorer typed:...`.
# Floor is the version the arm was measured with: the adapter relies on
# `predict(..., max_len=)` and on `usage.truncated` / `usage.state_tokens_dropped`.
typed-scorer = ["laya>=0.3.24", "torch>=2.0"]

[project.scripts]
dokimi = "dokimi.cli:main"

[project.urls]
Homepage = "https://github.com/intel/dokimi"
Documentation = "https://intel.github.io/dokimi/"
Repository = "https://github.com/intel/dokimi"
Issues = "https://github.com/intel/dokimi/issues"
Changelog = "https://github.com/intel/dokimi/blob/main/dokimi/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dokimi*"]

[tool.setuptools.package-data]
# Everything the package reads at run time from next to its own modules. A file
# missing here works from a checkout and breaks only in an installed wheel;
# tests/test_packaging.py and the CI `package` job catch that.
dokimi = [
  "products.yaml",
  "intents.yaml",
  "config/*.yaml",
  "runner/spec.schema.json",
  "schemas/*.json",
  "repos/profiles/*.yaml",
  "repos/support/*.py",
]

[tool.scriv]
# Changelog fragments: every PR adds its own changelog.d/<name>.md instead of
# editing CHANGELOG.md, so concurrent PRs never conflict there. See
# changelog.d/README.md.
format = "md"
fragment_directory = "changelog.d"
new_fragment_template = "file: fragment_template.md.j2"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security", "Documentation"]
output_file = "CHANGELOG.md"
md_header_level = "2"
entry_title_template = "[{{ version }}] — {{ date.strftime('%Y-%m-%d') }}"
version = "literal: pyproject.toml: project.version"

# Dependency hygiene (deptry, CI's typecheck job): every third-party import in
# the package, cli.py and scripts/ is declared in [project.dependencies] or an
# extra, imported directly rather than through another package's dependencies,
# and every declared runtime dependency is imported. Run from dokimi/ in an env
# with the lock installed, so import names come from the installed metadata.
# tests/ is skipped (deptry's default exclude): the test deps live in
# requirements-test.txt and the dev extra.
[tool.deptry]
extend_exclude = [
  # The docs build's hooks: their deps are requirements-docs.txt, not the wheel's.
  "scripts/docs",
  # Run by conda-forge.yml, which installs packaging for it.
  "scripts/conda_forge_specs.py",
]
# Tools in the dev extra (pytest and plugins, ruff, mypy, scriv), never imported by
# the package. A dev dep imported from the package is DEP004.
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# scripts/audit_mocks.py, imported by its sibling audit_test_quality.py through a sys.path insert.
DEP001 = ["audit_mocks"]
# Declared only to cap the version ragas resolves (see the comment in the ragas extra).
DEP002 = ["langchain-community"]

[tool.ruff]
line-length = 100
target-version = "py311"
# tests/fixtures/task_formats: third-party eval files copied unchanged (its MANIFEST.yaml).
extend-exclude = ["benchmarks", "data", "tests/fixtures/task_formats"]

# These two run on another interpreter, not dokimi's: the hook on the task
# image's python3, the proxy in the sidecar (DOKIMI_PROXY_IMAGE can be any image
# with Python 3). Either may still be 3.10, so keep its syntax checked there.
# per-file-target-version feeds ruff's version-related syntax errors, which the
# pinned ruff (dev extra above) reports by default.
[tool.ruff.per-file-target-version]
"dokimi/repos/support/no_background.py" = "py310"
"dokimi/harnesses/egress_proxy.py" = "py310"
# The built-in review graders run on the task image's python3 too, 3.8 or newer (contract §4.5).
"dokimi/repos/graders/*.py" = "py38"

# A correctness gate: rules that flag code that misbehaves (a swallowed
# KeyboardInterrupt, a naive datetime, a file handle never closed, an assert
# that never runs), not style. A family is taken whole where its rules are of
# that kind and its few style rules are cheap or ignored below; elsewhere the
# rules are listed one by one, so a ruff upgrade cannot add style rules to it.
# A whole family does gain rules with ruff releases (0.16.0 stabilized LOG004
# and PLE0304, preview-only in 0.12), so ruff is pinned to one version here, in
# requirements-ci.txt (the tools lock CI installs) and in .pre-commit-config.yaml,
# and Renovate bumps all three in one PR that runs the new rules.
#
# Not enabled yet, with their violation counts at ruff 0.17.0. These three are
# autofixes across most files: they land in a PR of their own while few PRs
# are open, and per-file-target-version keeps UP from rewriting the py310
# files above for 3.11:
#   UP (pyupgrade) 1399, of which PEP 585/604 annotations 1185, imports 162
#   I (isort) 156
#   RUF100 (unused noqa) 22: most name rules not selected (BLE001, E402), so
#   select those or list them in lint.external first
# Hand fixes deferred because an open PR rewrites the same lines (#29, one
# process runner for the spawn sites):
#   PLW1509 (preexec_fn with threads) 1, PLW1510 (subprocess.run without
#   check=) 15
# Bug-prone, each site needs a look:
#   PLW2901 (loop variable reassigned) 20, RUF043 (pytest.raises match= with
#   unescaped regex characters) 24, ISC004 (implicit concatenation in a
#   collection, i.e. a missing comma) 67, BLE001 (blind except) 64,
#   PT011 (pytest.raises too broad) 53, RUF012 (mutable class attribute) 8:
#   constants and test stubs, but Tool.parameters is also set per instance
[tool.ruff.lint]
select = [
  "F",      # pyflakes
  "B",      # bugbear
  "E9",     # syntax errors
  "E711", "E712", "E713", "E714", "E721", "E722",  # None/bool/type compares, bare except
  "A",      # shadowed builtins and stdlib modules
  "ASYNC",  # blocking calls in async code
  "DTZ",    # naive datetimes
  "EXE",    # shebang vs executable bit
  "G",      # logging call arguments
  "ISC001", # implicit concatenation on one line (a missing comma)
  "LOG",    # logger misuse
  "PGH",    # blanket noqa / type: ignore
  "PIE",    # duplicate class fields, non-unique enums, no-op statements
  "PLE",    # pylint errors
  "PLW",    # pylint warnings (exceptions below)
  "SIM115", # open() outside a context manager
  "T10",    # leftover debugger
  "YTT",    # sys.version misuse
  # pytest: checks that never run or match the wrong thing
  "PT008", "PT010", "PT014", "PT015", "PT017", "PT025", "PT026", "PT028", "PT030",
  # ruff-specific bug rules (the rest of RUF is style)
  "RUF006", "RUF008", "RUF009", "RUF013", "RUF016", "RUF017", "RUF018",
  "RUF020", "RUF024", "RUF026", "RUF028", "RUF030", "RUF032", "RUF033", "RUF034",
  "RUF040", "RUF048", "RUF049", "RUF053", "RUF060", "RUF061", "RUF063", "RUF064",
  "RUF068", "RUF071", "RUF101", "RUF102", "RUF103", "RUF104", "RUF200",
]
ignore = [
  "A002",     # argument named like a builtin: keyword APIs mirror subprocess's input=
  "G004",     # f-string in a logging call: style, 108 sites
  "PLW0108",  # unnecessary lambda: its fix evaluates the call eagerly
  "PLW0603",  # global statement: style
  "PLW1509", "PLW1510", "PLW2901",  # deferred, see above
  "PLW3301",  # nested min/max: style
]

# Type checking covers the whole package. All modules are subject to mypy checks.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
# Pydantic models (the LangChain chat classes) take field aliases such as
# model= and api_key=; without the plugin mypy sees only the field names.
plugins = ["pydantic.mypy"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
extra_checks = true
files = ["dokimi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite runs offline: a test that connects to anything but loopback fails
# instead of quietly depending on a live service. Loopback stays open for tests
# that run a local server (the egress proxy). Needs pytest-socket
# (requirements-test.txt).
addopts = ["--allow-hosts=127.0.0.1,::1"]
# A hung test fails after 60 s instead of holding the job until its 6 h limit
# (pytest-timeout). The slowest test takes ~20 s. On POSIX the default method,
# signal (SIGALRM, handled in the main thread), fails only the hung test: its
# fixtures still tear down and the run goes on, whatever the proxy and server
# threads it started are doing. Without SIGALRM (Windows) it falls back to
# thread, which dumps the stacks and ends the whole run.
timeout = 60
# A warning is a failure: deprecations surface when they appear, not when the
# removal breaks the suite, and an unclosed file or socket is a ResourceWarning.
# A third-party warning gets a narrow ignore (module, category, message) with
# the reason; ours are fixed where they are raised.
filterwarnings = [
  "error",
  # litellm's __init__ ignores this pydantic notice with a process-wide filter,
  # which pytest resets per test; a litellm response model first built in a later
  # test then warns, once per model (ReadOnly TypedDict items are not enforced).
  "ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem' is using the `ReadOnly` qualifier:UserWarning:pydantic._internal._generate_schema",
]
# Test order is shuffled and `random` reseeded per test (pytest-randomly), so a
# test that leans on another's leftovers fails. The header prints the seed;
# `--randomly-seed=<seed>` replays that order, `-p no:randomly` keeps file order.
