[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dokimi"
version = "0.1.0"
description = "Measures whether a skill, MCP doc source, documentation set or agent profile actually improves AI-agent answers and task outcomes"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Intel Corporation" }]
keywords = ["documentation", "benchmark", "evaluation", "llm", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.1,<7",
  "jsonschema>=4.20,<5",
  "litellm>=1.74.0",
  "httpx>=0.27.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "beautifulsoup4>=4.12.0",
  "PyGithub>=2.1.0",
  "ragas>=0.3.0,<0.4",
  # Every ragas release imports langchain_community.chat_models.vertexai, which 0.4.2 removed.
  "langchain-community<0.4.2",
  # eval ragas wraps the judge in ChatAnthropic for the anthropic provider.
  "langchain-anthropic>=1.0,<2",
  "datasets>=2.20,<6",
  "openai>=1.51,<3",
  "anthropic~=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "pytest-socket>=0.7",
  "diff-cover>=10.0",
  "ruff>=0.12",
  "mypy>=1.8",
  "types-PyYAML",
  "types-jsonschema",
  "scriv>=1.5",
]
ocr = ["docling>=2.0"]
mcp = ["mcp>=1.0"]
embeddings = ["sentence-transformers>=2.2"]
# Optional local baseline arm for `eval judge-validity --scorer typed:...`.
# Floor is the version the arm was measured with: the adapter relies on
# `predict(..., max_len=)` and on `usage.truncated` / `usage.state_tokens_dropped`.
typed-scorer = ["laya>=0.3.24", "torch>=2.0"]

[project.scripts]
dokimi = "dokimi.cli:main"

[project.urls]
Homepage = "https://github.com/intel/dokimi"
Documentation = "https://intel.github.io/dokimi/"
Repository = "https://github.com/intel/dokimi"
Issues = "https://github.com/intel/dokimi/issues"
Changelog = "https://github.com/intel/dokimi/blob/main/dokimi/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dokimi*"]

[tool.setuptools.package-data]
# Everything the package reads at run time from next to its own modules. A file
# missing here works from a checkout and breaks only in an installed wheel;
# tests/test_packaging.py and the CI `package` job catch that.
dokimi = [
  "products.yaml",
  "intents.yaml",
  "config/*.yaml",
  "runner/spec.schema.json",
  "schemas/*.json",
  "repos/profiles/*.yaml",
  "repos/support/*.py",
]

[tool.scriv]
# Changelog fragments: every PR adds its own changelog.d/<name>.md instead of
# editing CHANGELOG.md, so concurrent PRs never conflict there. See
# changelog.d/README.md.
format = "md"
fragment_directory = "changelog.d"
new_fragment_template = "file: fragment_template.md.j2"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security", "Documentation"]
output_file = "CHANGELOG.md"
md_header_level = "2"
entry_title_template = "[{{ version }}] — {{ date.strftime('%Y-%m-%d') }}"
version = "literal: pyproject.toml: project.version"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks", "data"]

# These two run on another interpreter, not dokimi's: the hook on the task
# image's python3, the proxy in the sidecar (DOKIMI_PROXY_IMAGE can be any image
# with Python 3). Either may still be 3.10, so keep its syntax checked there.
# per-file-target-version needs ruff 0.9.8; the version-related syntax errors it
# feeds are reported by default from ruff 0.12.
[tool.ruff.per-file-target-version]
"dokimi/repos/support/no_background.py" = "py310"
"dokimi/harnesses/egress_proxy.py" = "py310"

# Correctness-focused gate to start (pyflakes + bugbear + syntax). Stylistic
# modernization (import sorting, PEP 585/604 hints) is deferred to a follow-up
# so the initial gate is enforceable without a repo-wide reformat.
[tool.ruff.lint]
select = ["F", "B", "E9"]
ignore = ["B008"]

# Type checking covers the whole package. The modules listed in the override
# below carried type errors when the gate was widened from a hand-picked file
# list; they are exempt until fixed. Do not add to that list: a new module is
# checked from its first commit. Removing an entry is the way to shrink it.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_ignores = false
no_implicit_optional = true
files = ["dokimi"]

[[tool.mypy.overrides]]
module = [
  "dokimi.commands.catalog",
  "dokimi.eval.agent_runner",
  "dokimi.eval.answerer",
  "dokimi.eval.arm_runner",
  "dokimi.eval.judge",
  "dokimi.eval.panel",
  "dokimi.llm",
  "dokimi.mcp.context7",
  "dokimi.mcp.factory",
  "dokimi.novelty.attribute",
  "dokimi.novelty.needs",
  "dokimi.novelty.spans",
  "dokimi.orchestrator.pipeline",
  "dokimi.personas.analyzer",
  "dokimi.personas.generator",
  "dokimi.questions.llm_gen",
  "dokimi.questions.panel_reviewer",
  "dokimi.questions.quality_analyzer",
  "dokimi.questions.validator",
  "dokimi.report.eval_report",
  "dokimi.report.model_compare",
  "dokimi.report.task_runs_report",
  "dokimi.treatments.arms",
  "dokimi.treatments.factory",
  "dokimi.treatments.tools",
  "dokimi.utils",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite runs offline: a test that connects to anything but loopback fails
# instead of quietly depending on a live service. Loopback stays open for tests
# that run a local server (the egress proxy). Needs pytest-socket
# (requirements-test.txt).
addopts = ["--allow-hosts=127.0.0.1,::1"]
