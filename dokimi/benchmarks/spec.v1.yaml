version: 1
schema: ../dokimi/runner/spec.schema.json
name: dokimi-spec-v1
mode: non_blocking

weights:
  coverage: 0.35
  freshness_lite: 0.25
  readability: 0.20
  example_pass_rate: 0.20
  llm_eval: 0.0

metrics:
  coverage:
    enabled: true
    weight: 0.35
    target: 0.90
  freshness_lite:
    enabled: true
    weight: 0.25
    max_age_days: 365
  readability:
    enabled: true
    weight: 0.20
    grade_max: 12
  example_pass_rate:
    enabled: true
    weight: 0.20
    # Execution policy for fenced code examples. The default backend is "none"
    # (no execution). These docs are self-owned and trusted, so we opt into
    # host execution explicitly. For untrusted corpora use backend: docker.
    execution:
      backend: subprocess
      allow_host: true
      timeout: 5
  llm_eval:
    enabled: false
    weight: 0.0

thresholds:
  score:
    green: 0.85
    yellow: 0.70
    red: 0.0
  regressions:
    score_drop_warn: 0.03
    score_drop_critical: 0.08
    metric_drop_warn: 0.05
    metric_drop_critical: 0.12

critical_bands:
  fail_on:
    - condition: score_below
      value: 0.60
    - condition: coverage_below
      value: 0.70

ci:
  policy: non_blocking
  report_formats:
    - json
    - markdown

future:
  soft_gate:
    enabled: false
    min_score: 0.80
  hard_gate:
    enabled: false
    min_score: 0.85

# Bounds on the document set the static track scores. They are a sanity check
# on the include/exclude globs, not a target: min_docs catches a glob that
# matched almost nothing, max_docs catches one that escaped into the tree (8
# markdown files live outside docs/). Measured selection at the time of
# writing: 36 files. Adding a doc past the ceiling is meant to be a deliberate
# edit here, so raise max_docs in the same commit that adds the doc.
golden_manifest:
  min_docs: 10
  max_docs: 36
  include:
    - docs/**/*.md
  exclude:
    - docs/archive/**
