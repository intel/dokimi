# The framework's own agent guidance, scanned by L0 in CI (`repo scan .. --manifest-file`).
# eval_dir and tasks are required by repo_manifest.v1 and unused by a scan; this file is for
# `repo scan` only (`repo validate` would refuse it: the framework has no repository tasks).
schema: repo_manifest.v1
id: dokimi
eval_dir: dokimi/tests
guidance:
  globs: ["**/AGENTS.md"]
  # AGENTS.md is listed as well as globbed: a glob that matches nothing is only a warning, so
  # deleting the root guidance would otherwise leave the gate green.
  also_scan: ["AGENTS.md", "CONTRIBUTING.md", "dokimi/CONTRIBUTING.md", "dokimi/README.md", "README.md"]
entry_points: {grade: "true"}
tasks: dokimi/tests
build_systems: [pytest]
