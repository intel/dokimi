# Trace links for the acceptance criteria of docs/user-journeys/journeys.md.
# The criterion text lives in that page only; this file says, per criterion,
# what is delivered, which CLI surfaces serve it (resolved against
# build_parser()), and which tests are its evidence (`@pytest.mark.outcome`
# ids, the same mechanism as the *.json contracts beside this file).
#
# enforce: true makes `pytest --outcomes` fail when the evidence is missing,
# fails, is all skipped, or (for a cli_scenario) never invoked the declared
# surface. Only enforce what is implemented. A documented criterion with no
# entry, or with enforce: false, is reported as unverified and fails nothing.
# Field meanings: docs/user-journeys/traceability.md.
schema: 1
catalog: docs/user-journeys/journeys.md

